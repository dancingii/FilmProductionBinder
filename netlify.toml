[build]
  command = "rm -rf node_modules && npm install --legacy-peer-deps && npm run build"
  publish = "build"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"
  NPM_FLAGS = "--legacy-peer-deps"
  CI = "false"

[dev]
  command = "npm start"
  targetPort = 3000
  port = 8888
  publish = "build"
  functions = "netlify/functions"